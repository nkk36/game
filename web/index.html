<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Golden (Water) Gun</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #bevy {
      display: block;
      width: 100%;
      height: 100%;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ddd;
      font-family: sans-serif;
      font-size: 18px;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="loading">Loading...</div>
  <canvas id="bevy"></canvas>
  <script type="module">
    import init from "./game.js";
    init().then(() => {
      document.getElementById("loading").style.display = "none";
    }).catch((err) => {
      document.getElementById("loading").textContent =
        "Failed to load: " + err;
      console.error(err);
    });
  </script>
</body>
</html>
